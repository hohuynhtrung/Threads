    <title>Threads</title>

    <script>
      (function () {
        const { pathname, search, hash } = window.location;
        const basePath = "/Threads/";

        if (search.startsWith("?/")) {
          const parts = search
            .slice(2)
            .split("&")
            .map((part) => part.replace(/~and~/g, "&"));

          const route = parts.shift() || "";
          const query = parts.length ? "?" + parts.join("&") : "";

          const restoredPath = basePath + route + query + hash;

          window.history.replaceState(null, "", restoredPath);
        }
      })();
    </script>
